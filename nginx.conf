server {
    listen 8080;
    server_name _;

    location = /simuladorboali {
        default_type text/html;
        alias /usr/share/nginx/html/index.html;
    }

    location ^~ /simuladorboali/ {
        alias /usr/share/nginx/html/;
        index index.html;
    }

    location / {
        return 404;
    }
}
